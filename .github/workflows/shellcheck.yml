name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ShellCheck comes preinstalled on GitHub's Ubuntu runners.
      - name: Run ShellCheck on all tracked shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
